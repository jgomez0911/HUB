<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gomez Family Project Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- PWA & Home Screen App Config -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#38bdf8">

    <!-- iPadOS / iOS Home Screen Fullscreen & Custom Thumbnail -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gomez Hub">
    <link rel="apple-touch-icon" href="/hub-icon.png">
    <link rel="icon" type="image/svg+xml" href="/hub-icon.svg">
    <style>
        :root {
            --bg-top: #e0f7ff;
            --bg-mid: #fff6fb;
            --bg-bot: #fffbe6;
            --ink: #232946;
            --muted: #5f6c88;
            --card-bg: #ffffff;
            --shadow: 0 10px 24px rgba(35, 41, 70, 0.08);
            --shadow-hover: 0 18px 34px rgba(35, 41, 70, 0.15);
        }

        /* Hide scrollbars & prevent accidental zoom on touch devices */
        html, body {
            touch-action: pan-x pan-y;
            overscroll-behavior: none;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
            color: var(--ink);
            background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
        }

        * {
            box-sizing: border-box;
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-tap-highlight-color: transparent;
        }

        *::-webkit-scrollbar {
            display: none;
        }

        /* Floating kid-friendly background shapes */
        .bg-bubbles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            opacity: 0.45;
            animation: floatSlow 12s ease-in-out infinite;
        }

        .b1 { width: 220px; height: 220px; background: #bae6fd; top: -40px; left: -50px; animation-delay: 0s; }
        .b2 { width: 180px; height: 180px; background: #fbcfe8; top: 18%; right: -40px; animation-delay: 2.5s; }
        .b3 { width: 260px; height: 260px; background: #fde68a; bottom: -60px; left: 10%; animation-delay: 5s; }
        .b4 { width: 150px; height: 150px; background: #c7d2fe; bottom: 20%; right: 8%; animation-delay: 7s; }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-22px) rotate(8deg) scale(1.05); }
        }

        @keyframes bounceTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(14px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-6deg); }
            75% { transform: rotate(6deg); }
        }

        .page-wrap {
            position: relative;
            z-index: 1;
            max-width: 1360px;
            margin: 0 auto;
            padding: 24px 16px 56px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 26px;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            border: 2px solid #bae6fd;
            color: #0284c7;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 5px 14px;
            border-radius: 999px;
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.1);
            margin-bottom: 8px;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(2rem, 4vw, 3rem);
            margin: 0 0 4px;
            background: linear-gradient(90deg, #ff5d8f 0%, #ff9f1c 35%, #2ec4b6 70%, #4ea8de 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: bounceTitle 4s ease-in-out infinite;
        }

        .subtitle {
            margin: 0;
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--muted);
        }

        /* Category Sections */
        .category-section {
            margin-bottom: 32px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding-left: 2px;
        }

        .section-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 1.15rem;
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(35, 41, 70, 0.08);
        }

        .section-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.35rem;
            margin: 0;
            color: var(--ink);
        }

        .section-count {
            font-size: 0.78rem;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.85);
            color: var(--muted);
        }

        /* 4-Column Grid locked for iPad Portrait (768px+), iPad Landscape (1024px+), and Desktop */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
        }

        /* Phone fallback only below iPad width */
        @media (max-width: 720px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }
        }

        /* Fully Clickable Kid-Friendly Card */
        .card {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border-radius: 20px;
            border: 3px solid #ffffff;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: inherit;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease, border-color 0.22s ease;
            animation: popIn 0.45s ease backwards;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.015);
            box-shadow: var(--shadow-hover);
            border-color: #7dd3fc;
        }

        .card:active {
            transform: scale(0.97);
        }

        .card:hover .preview-badge {
            animation: wiggle 0.5s ease;
        }

        /* App Screenshot / Live Preview Frame */
        .preview-window {
            position: relative;
            width: 100%;
            height: 138px;
            overflow: hidden;
            background: #f1f5f9;
            border-bottom: 2px solid #f1f5f9;
        }

        /* Browser top bar dots for screenshot look */
        .browser-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 8px;
            z-index: 3;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .dot { width: 7px; height: 7px; border-radius: 50%; }
        .dot-r { background: #ff6b6b; }
        .dot-y { background: #ffd166; }
        .dot-g { background: #06d6a0; }

        /* Scaled live iframe snapshot + rich fallback artwork */
        .shot-fallback {
            position: absolute;
            inset: 20px 0 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            z-index: 1;
            padding: 8px;
            text-align: center;
        }

        .shot-fallback .big-emoji {
            font-size: 2.5rem;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.12));
        }

        .shot-fallback .mini-ui {
            display: flex;
            gap: 5px;
            margin-top: 2px;
        }

        .shot-fallback .mini-pill {
            height: 8px;
            width: 26px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.78);
        }

        /* Live mini-preview iframe scaled dynamically to fit 4-up card width */
        .live-shot {
            position: absolute;
            top: 20px;
            left: 0;
            width: 1200px;
            height: 760px;
            border: 0;
            transform: scale(var(--shot-scale, 0.22));
            transform-origin: top left;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .live-shot.loaded {
            opacity: 1;
        }

        .preview-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            z-index: 4;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 9px;
            border-radius: 999px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
        }

        /* Tag Colors */
        .tag-kids     { background: #ff5d8f; color: #ffffff; }
        .tag-game     { background: #ff9f1c; color: #ffffff; }
        .tag-physics  { background: #8338ec; color: #ffffff; }
        .tag-sim      { background: #2ec4b6; color: #ffffff; }
        .tag-school   { background: #3a86ff; color: #ffffff; }
        .tag-tool     { background: #06d6a0; color: #132a13; }

        /* Card Body */
        .card-body {
            padding: 13px 14px 14px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card h2 {
            font-family: 'Fredoka', sans-serif;
            margin: 0 0 5px;
            font-size: 1.12rem;
            line-height: 1.2;
            color: var(--ink);
        }

        .card p.desc {
            font-size: 0.83rem;
            font-weight: 600;
            color: var(--muted);
            line-height: 1.38;
            margin: 0 0 12px;
            flex-grow: 1;
        }

        .launch-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 10px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.86rem;
            background: #f1f5f9;
            color: var(--ink);
            transition: background 0.2s ease, color 0.2s ease;
        }

        .card:hover .launch-pill {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            color: #ffffff;
        }

        /* Featured Top Cards (Ice Cream & McDonald's) */
        .card.featured {
            border-color: #fde047;
            box-shadow: 0 12px 26px rgba(255, 159, 28, 0.16);
        }

        .card.featured .launch-pill {
            background: linear-gradient(90deg, #ff758f, #ff9f1c);
            color: #ffffff;
        }

        /* iPad Portrait (768px - 900px) fine-tuning so 4 cards stay roomy and crisp */
        @media (min-width: 721px) and (max-width: 920px) {
            .page-wrap { padding: 20px 12px 48px; }
            .grid { gap: 12px; }
            .preview-window { height: 112px; }
            .card-body { padding: 11px 11px 12px; }
            .card h2 { font-size: 1rem; }
            .card p.desc { font-size: 0.78rem; margin-bottom: 10px; }
            .launch-pill { font-size: 0.8rem; padding: 8px; }
        }
    </style>
</head>
<body>

    <div class="bg-bubbles" aria-hidden="true">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        <div class="bubble b4"></div>
    </div>

    <div class="page-wrap">
        <header>
            <div class="badge-pill">✨ Tap any card to play & explore!</div>
            <h1>Gomez Project Hub</h1>
            <p class="subtitle">Games, Pretend Play & Fun Apps by Jorge Gomez</p>
        </header>

        <main id="hub-sections"></main>
    </div>

    <script>
        const GROUPS = [
            {
                id: "kids-favorites",
                title: "Kids Favorites & Pretend Play",
                icon: "🍦",
                items: [
                    {
                        title: "The Michoacana Lili",
                        href: "icecream.html",
                        tag: "Kids",
                        tagClass: "tag-kids",
                        desc: "Frozen ice cream & paleta register for kids to take orders and ring up treats.",
                        cta: "Order Ice Cream",
                        emoji: "🍨❄️",
                        bg: "linear-gradient(135deg, #bae6fd 0%, #f5d0fe 55%, #fbcfe8 100%)",
                        featured: true
                    },
                    {
                        title: "McDonald's Menu",
                        href: "collection/Mcdonalds/index.html",
                        tag: "Kids",
                        tagClass: "tag-kids",
                        desc: "Pretend play fast-food ordering screen with burgers, fries, and receipts.",
                        cta: "Order Food",
                        emoji: "🍔🍟",
                        bg: "linear-gradient(135deg, #fde047 0%, #fca5a5 100%)",
                        featured: true
                    },
                    {
                        title: "Hero Game",
                        href: "collection/Hero/index.html",
                        tag: "Kids",
                        tagClass: "tag-kids",
                        desc: "Jump, run, and explore in a fun platform adventure game.",
                        cta: "Play Hero",
                        emoji: "🦸‍♂️⭐",
                        bg: "linear-gradient(135deg, #93c5fd 0%, #c4b5fd 100%)"
                    },
                    {
                        title: "Kitty Follow",
                        href: "collection/cat.html",
                        tag: "Kids",
                        tagClass: "tag-kids",
                        desc: "A gentle, relaxing game where a cute kitty chases a ball of yarn.",
                        cta: "Play Kitty",
                        emoji: "🐱🧶",
                        bg: "linear-gradient(135deg, #fbcfe8 0%, #fed7aa 100%)"
                    }
                ]
            },
            {
                id: "arcade-games",
                title: "Arcade & Action Games",
                icon: "🎮",
                items: [
                    {
                        title: "Tether Battle",
                        href: "collection/cirlce.html",
                        tag: "Game",
                        tagClass: "tag-game",
                        desc: "Physics survival game where movement creates lines. Cut opponent lines to win.",
                        cta: "Play Now",
                        emoji: "⚡⭕",
                        bg: "linear-gradient(135deg, #a5f3fc 0%, #818cf8 100%)"
                    },
                    {
                        title: "Precision Plinko",
                        href: "collection/pyramid.html",
                        tag: "Game",
                        tagClass: "tag-game",
                        desc: "Drop balls through a peg pyramid with bouncy collision physics.",
                        cta: "Drop Balls",
                        emoji: "🟡🔻",
                        bg: "linear-gradient(135deg, #fde68a 0%, #f9a8d4 100%)"
                    },
                    {
                        title: "Black Hole",
                        href: "collection/blackhole.html",
                        tag: "Game",
                        tagClass: "tag-game",
                        desc: "Swallow everything in sight and grow bigger in this space black hole game.",
                        cta: "Play Now",
                        emoji: "🌌🕳️",
                        bg: "linear-gradient(135deg, #c7d2fe 0%, #6366f1 100%)"
                    },
                    {
                        title: "FireWorks",
                        href: "collection/fireworks.html",
                        tag: "Game",
                        tagClass: "tag-game",
                        desc: "Tap the night sky to launch colorful, sparkling fireworks displays.",
                        cta: "Fireworks",
                        emoji: "🎆✨",
                        bg: "linear-gradient(135deg, #fda4af 0%, #c084fc 100%)"
                    }
                ]
            },
            {
                id: "simulators",
                title: "Simulators",
                icon: "🌲",
                items: [
                    {
                        title: "Forest Simulator",
                        href: "collection/forest.html",
                        tag: "Sim",
                        tagClass: "tag-sim",
                        desc: "Grow and connect a living mini forest using interactive nodes.",
                        cta: "Launch Sim",
                        emoji: "🌲🦌",
                        bg: "linear-gradient(135deg, #bbf7d0 0%, #6ee7b7 100%)"
                    },
                    {
                        title: "Receipt Generator",
                        href: "collection/reciepts.html",
                        tag: "Sim",
                        tagClass: "tag-sim",
                        desc: "Generate realistic custom receipts from a local database.",
                        cta: "Launch Sim",
                        emoji: "🧾🖨️",
                        bg: "linear-gradient(135deg, #e2e8f0 0%, #bae6fd 100%)"
                    }
                ]
            },
            {
                id: "physics",
                title: "Physics & Sound Labs",
                icon: "🔬",
                items: [
                    {
                        title: "Wave Lab",
                        href: "collection/wavelab.html",
                        tag: "Physics",
                        tagClass: "tag-physics",
                        desc: "Audio frequency synthesizer. Combine Sine, Square, and Saw waves.",
                        cta: "Open Lab",
                        emoji: "🎛️〰️",
                        bg: "linear-gradient(135deg, #ddd6fe 0%, #93c5fd 100%)"
                    },
                    {
                        title: "Cymatics Sand",
                        href: "collection/vibrations.html",
                        tag: "Physics",
                        tagClass: "tag-physics",
                        desc: "Simulates sand patterns on a vibrating Chladni plate to visualize sound.",
                        cta: "Open Lab",
                        emoji: "🔊✨",
                        bg: "linear-gradient(135deg, #fef08a 0%, #c4b5fd 100%)"
                    }
                ]
            },
            {
                id: "school-tools",
                title: "School, Time & Productivity",
                icon: "🎒",
                items: [
                    {
                        title: "Math Calculator",
                        href: "collection/mathSprout.html",
                        tag: "School",
                        tagClass: "tag-school",
                        desc: "A visual tool to help kids learn and solve math using interactive nodes.",
                        cta: "Open Tool",
                        emoji: "🧮🌱",
                        bg: "linear-gradient(135deg, #bae6fd 0%, #bbf7d0 100%)"
                    },
                    {
                        title: "Grade Forecaster",
                        href: "collection/grade.html",
                        tag: "School",
                        tagClass: "tag-school",
                        desc: "Visual Water Tank grade calculator with auto-save and What-If sliders.",
                        cta: "Open Tool",
                        emoji: "📊💧",
                        bg: "linear-gradient(135deg, #7dd3fc 0%, #a5b4fc 100%)"
                    },
                    {
                        title: "Summer Countdown",
                        href: "collection/Countdown.html",
                        tag: "Time",
                        tagClass: "tag-tool",
                        desc: "Count down the remaining days until summer break arrives.",
                        cta: "Check Timer",
                        emoji: "☀️🏖️",
                        bg: "linear-gradient(135deg, #fde68a 0%, #fdba74 100%)"
                    },
                    {
                        title: "Focus Fractal",
                        href: "collection/focus.html",
                        tag: "Productivity",
                        tagClass: "tag-tool",
                        desc: "A Pomodoro timer that grows a procedural tree while you study.",
                        cta: "Start Focus",
                        emoji: "🌳⏱️",
                        bg: "linear-gradient(135deg, #a7f3d0 0%, #99f6e4 100%)"
                    }
                ]
            }
        ];

        function updatePreviewScales() {
            document.querySelectorAll(".preview-window").forEach((win) => {
                const scale = win.clientWidth / 1200;
                win.style.setProperty("--shot-scale", scale.toFixed(4));
            });
        }

        function renderHub() {
            const container = document.getElementById("hub-sections");
            if (!container) return;

            container.innerHTML = GROUPS.map((group) => {
                const cardsHtml = group.items.map((item, idx) => `
                    <a href="${item.href}" class="card ${item.featured ? "featured" : ""}" style="animation-delay: ${idx * 50}ms">
                        <div class="preview-window">
                            <div class="browser-bar">
                                <span class="dot dot-r"></span>
                                <span class="dot dot-y"></span>
                                <span class="dot dot-g"></span>
                            </div>
                            <div class="shot-fallback" style="background: ${item.bg};">
                                <span class="big-emoji">${item.emoji}</span>
                                <div class="mini-ui">
                                    <span class="mini-pill"></span>
                                    <span class="mini-pill"></span>
                                    <span class="mini-pill"></span>
                                </div>
                            </div>
                            <iframe
                                class="live-shot"
                                data-src="${item.href}"
                                title="${item.title} preview"
                                loading="lazy"
                                tabindex="-1"
                                aria-hidden="true"
                            ></iframe>
                            <span class="preview-badge ${item.tagClass}">${item.tag}</span>
                        </div>
                        <div class="card-body">
                            <h2>${item.title}</h2>
                            <p class="desc">${item.desc}</p>
                            <div class="launch-pill">${item.cta} ➜</div>
                        </div>
                    </a>
                `).join("");

                return `
                    <section class="category-section" aria-labelledby="sec-${group.id}">
                        <div class="section-header">
                            <div class="section-icon">${group.icon}</div>
                            <h2 class="section-title" id="sec-${group.id}">${group.title}</h2>
                            <span class="section-count">${group.items.length}</span>
                        </div>
                        <div class="grid">
                            ${cardsHtml}
                        </div>
                    </section>
                `;
            }).join("");

            updatePreviewScales();

            requestAnimationFrame(() => {
                document.querySelectorAll(".live-shot").forEach((frame) => {
                    frame.addEventListener("load", () => {
                        frame.classList.add("loaded");
                    });
                    frame.src = frame.dataset.src;
                });
            });
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", renderHub);
        } else {
            renderHub();
        }

        window.addEventListener("resize", updatePreviewScales);

        // Prevent multi-touch pinch zoom on kids' iPads/tablets
        document.addEventListener("gesturestart", (e) => e.preventDefault());
        document.addEventListener("touchmove", (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
